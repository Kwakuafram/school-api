services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - sms_network

  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sms_network

  postgres:
    image: postgres:16
    container_name: sms_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sms_local
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: secret
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    networks:
      - sms_network

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sms_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - sms_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - sms_network

  mailpit:
    image: axllent/mailpit
    container_name: sms_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sms_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sms_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - sms_network
    depends_on:
      - postgres

volumes:
  sms_postgres_data:

networks:
  sms_network:
    driver: bridge